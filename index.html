<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WeatherMap search for a location and view the weather there on a map."
    />
    <title>WeatherMap</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <h1>WeatherMap</h1>
        <p>Search for a place and view the weather there on a map.</p>
      </header>

      <section class="search-panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Find a location</h2>
        <form id="location-search-form" novalidate>
          <label for="location-search">Location</label>
          <div class="search-controls">
            <div class="search-input-wrapper">
              <input
                id="location-search"
                name="location"
                type="search"
                dir="auto"
                placeholder="e.g., Khartoum, Sudan"
                autocomplete="off"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="location-suggestions"
                aria-expanded="false"
                aria-activedescendant=""
                required
              />
              <ul id="location-suggestions" role="listbox" aria-label="Location suggestions" hidden></ul>
            </div>
            <button type="submit">Get Weather</button>
          </div>
          <div id="suggestion-status" class="visually-hidden" role="status" aria-live="polite"></div>
        </form>
        <p class="search-attribution">
          Search results by
          <a href="https://nominatim.openstreetmap.org/ui/search.html" target="_blank" rel="noreferrer">OpenStreetMap Nominatim</a>.
        </p>
        <p class="search-attribution">
          Location suggestions by
          <a href="https://open-meteo.com/en/docs/geocoding-api" target="_blank" rel="noreferrer">Open-Meteo</a>.
        </p>
      </section>

        <section id="favorites-panel" class="favorites-panel" aria-labelledby="favorites-heading" hidden>
          <h2 id="favorites-heading">Favorites</h2>
          <ul id="favorites-list"></ul>
        </section>

      <div id="loading-indicator" role="status" aria-live="polite" hidden>
        Loading weather information…
      </div>
      <div id="message-area" role="alert" aria-live="assertive"></div>

      <section class="map-panel" aria-label="Weather map">
        <div id="map" role="region" aria-label="Map of the selected location"></div>
      </section>

      <section id="weather-results" aria-labelledby="weather-results-heading" hidden>
        <h2 id="weather-results-heading">Current weather</h2>
        <div id="weather-details"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/config.local.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
