
name: Deploy WeatherMap-SUST to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create weather configuration
        env:
          WEATHER_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: |
          test -n "$WEATHER_API_KEY" || {
            echo "Missing OPENWEATHERMAP_API_KEY secret"
            exit 1
          }
          printf 'window.WEATHERMAP_CONFIG = Object.freeze({ openWeatherMapApiKey: "%s" });\n' "$WEATHER_API_KEY" > js/config.local.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
